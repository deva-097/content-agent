scout:
  sources:
    blogs:
      # --- Already in your reading diet (from browsing audit) ---
      - url: "https://stratechery.com/feed/"
        type: rss
        label: "Stratechery (Ben Thompson)"
      - url: "https://www.oneusefulthing.org/feed"
        type: rss
        label: "One Useful Thing (Ethan Mollick)"
      - url: "https://simonwillison.net/atom/everything/"
        type: rss
        label: "Simon Willison"
      - url: "https://www.henrikkarlsson.xyz/feed"
        type: rss
        label: "Henrik Karlsson (Escaping Flatland)"
      - url: "https://every.to/feed.xml"
        type: rss
        label: "Every.to"
      - url: "https://fahadhasin.substack.com/feed"
        type: rss
        label: "Fahad Hasin (Intellectual Sonder)"
      - url: "https://mitchellh.com/feed.xml"
        type: rss
        label: "Mitchell Hashimoto"

      # --- Blind spots from audit: strategy & consulting depth ---
      - url: "https://hbr.org/the-latest"
        type: blog
        label: "Harvard Business Review"
      - url: "https://rogermartin.medium.com/feed"
        type: rss
        label: "Roger Martin"

      # --- AI/ML depth beyond ChatGPT ---
      - url: "https://www.anthropic.com/research/feed.xml"
        type: rss
        label: "Anthropic Research"
      - url: "https://openai.com/blog/rss.xml"
        type: rss
        label: "OpenAI Blog"
      - url: "https://lilianweng.github.io/index.xml"
        type: rss
        label: "Lil'Log (Lilian Weng)"

      # --- SaaS / startup strategy ---
      - url: "https://www.lennysnewsletter.com/feed"
        type: rss
        label: "Lenny's Newsletter"
      - url: "https://www.notboring.co/feed"
        type: rss
        label: "Not Boring (Packy McCormick)"
    newsletters: []
    podcasts: []

  topics:
    - "AI agents enterprise adoption"
    - "SaaS strategy 2026"
    - "management consulting AI transformation"
    - "generative AI product development"

  max_items_per_source: 10
  llm_model: "claude-haiku-4-5-20251001"

mirror:
  chrome_history_path: "~/Library/Application Support/Google/Chrome/Default/History"

  exclude_domains:
    - "google.com"
    - "mail.google.com"
    - "accounts.google.com"
    - "localhost"
    - "chrome://"
    - "chrome-extension://"
    - "new-tab-page"

  productive_domains:
    - "arxiv.org"
    - "hbr.org"
    - "stratechery.com"
    - "oneusefulthing.org"
    - "github.com"
    - "stackoverflow.com"
    - "medium.com"
    - "substack.com"

  waste_domains:
    - "youtube.com"
    - "amazon.in"
    - "amazon.com"
    - "flipkart.com"
    - "myntra.com"
    - "reddit.com"

  min_visit_duration_seconds: 30
  llm_model: "claude-haiku-4-5-20251001"

scribe:
  output_dir: "~/Documents/Obsidian Vault/Haven/Content/Drafts"
  linkedin_max_words: 300
  llm_model: "claude-sonnet-4-20250514"

email:
  env_prefix: "CONTENT_AGENT"
  dry_run: false
